<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外国語 スピーチ・発表サポーター</title>
  <style>
    :root {
      --primary: #2B6CB0;
      --primary-light: #EBF8FF;
      --secondary: #DD6B20;
      --secondary-light: #FFFAF0;
      --green: #38A169;
      --green-hover: #2F855A;
      --bg: #EDF2F7;
      --text: #2D3748;
      --muted: #718096;
      --border: #CBD5E0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial,
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 20px;
      color: var(--primary);
      font-size: 24px;
      text-align: center;
    }

    .tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 8px;
      overflow-x: auto;
      border-bottom: 2px solid var(--border);
    }

    .tab-btn {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #E2E8F0;
      color: #4A5568;
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .step-box {
      margin-bottom: 20px;
      padding: 16px;
      border-left: 6px solid var(--primary);
      border-radius: 8px;
      background: var(--primary-light);
    }

    .step-title {
      margin-bottom: 12px;
      color: #1A365D;
      font-size: 18px;
      font-weight: bold;
    }

    .topic-grid, .reason-grid, .grammar-list-grid {
      display: grid;
      gap: 12px;
    }

    .topic-grid {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    .reason-grid {
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    }

    .grammar-list-grid {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    .topic-btn, .reason-btn {
      padding: 14px;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: #fff;
      color: var(--primary);
      font-size: 16px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
    }

    .topic-btn.active, .reason-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .grammar-box {
      margin-top: 12px;
      padding: 16px;
      border: 2px dashed var(--secondary);
      border-radius: 8px;
      background: var(--secondary-light);
    }

    .grammar-hint {
      margin-top: 4px;
      color: #C05621;
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 16px;
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(43,108,176,.2);
    }

    .card-deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .word-card {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #fff;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform .1s, border-color .2s, box-shadow .2s;
    }

    .word-card:hover, .word-card:focus {
      border-color: var(--secondary);
      outline: none;
      transform: translateY(-2px);
    }

    .word-card.selected {
      border-color: var(--secondary);
      background: var(--secondary-light);
      box-shadow: 0 0 8px rgba(221,107,32,.35);
    }

    .card-icon {
      margin-bottom: 4px;
      font-size: 30px;
    }

    .card-en {
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .card-kana {
      color: var(--muted);
      font-size: 12px;
    }

    .card-jp {
      color: var(--primary);
      font-size: 13px;
      font-weight: bold;
    }

    .pronoun-control {
      margin-top: 14px;
    }

    .pronoun-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background: #2D3748;
      color: #fff;
    }

    .preview-title {
      margin-bottom: 8px;
      color: #A0AEC0;
      font-size: 16px;
    }

    .preview-text {
      font-size: 20px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .speed-control {
      display: flex;
      flex: 1 1 100%;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: bold;
    }

    .speed-control input {
      flex: 1;
      min-width: 130px;
      accent-color: #68D391;
    }

    .action-btn {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-speak { background: var(--green); }
    .btn-speak:hover { background: var(--green-hover); }
    .btn-copy { background: #4299E1; }

    .grammar-item-card {
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .grammar-item-card:hover, .grammar-item-card:focus {
      border-color: var(--primary);
      outline: none;
    }

    .grammar-item-tag {
      display: inline-block;
      margin-bottom: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--secondary-light);
      color: var(--secondary);
      font-size: 12px;
      font-weight: bold;
    }

    .grammar-item-pat {
      color: var(--primary);
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .grammar-item-jp {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      z-index: 1000;
      right: 16px;
      bottom: 20px;
      left: 16px;
      width: max-content;
      max-width: calc(100% - 32px);
      margin: auto;
      padding: 12px 20px;
      border-radius: 8px;
      background: #2D3748;
      color: #fff;
      text-align: center;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }

    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .container { padding: 16px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎤 小学校外国語 スピーチ・発表サポーター</h1>

  <nav class="tab-nav" aria-label="メインメニュー">
    <button class="tab-btn active" type="button" onclick="switchTab('speech')">
      🎤 スピーチ作成
    </button>
    <button class="tab-btn" type="button" onclick="switchTab('vocab')">
      📚 索引・単語帳
    </button>
    <button class="tab-btn" type="button" onclick="switchTab('grammar')">
      📖 かんたん文法ガイド
    </button>
  </nav>

  <section id="tab-speech" class="tab-content active">
    <div class="step-box">
      <div class="step-title">STEP 1: はっぴょうするトピックをえらぼう</div>
      <div class="topic-grid">
        <button class="topic-btn" type="button" onclick="selectTopic('dream', this)">
          ✨ 将来の夢 (My Future Dream)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('memories', this)">
          🏫 小学校の思い出 (My Memories)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('can', this)">
          ⚽ できること・得意なこと (What I Can Do)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('favorites', this)">
          🍕 好きなもの・季節 (My Favorites)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('town', this)">
          🏙️ わたしの町・学校紹介 (My Town & School)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('weekend', this)">
          📅 週末・休日の過ごし方 (My Weekend)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('hero', this)">
          👨‍👩‍👧‍👦 家族・お友達の紹介 (My Hero / Family)
        </button>
        <button class="topic-btn" type="button" onclick="selectTopic('world', this)">
          🌏 行ってみたい国 (Countries I Want to Visit)
        </button>
      </div>
    </div>

    <div class="step-box" id="step2" style="display:none;">
      <div class="step-title">STEP 2: つたえたい内容をえらぼう</div>
      <div class="reason-grid" id="reasonGrid"></div>
    </div>

    <div class="step-box" id="step3" style="display:none;">
      <div class="step-title">STEP 3: 文法パターンと単語カード</div>

      <div class="grammar-box" id="grammarBox"></div>

      <div class="pronoun-control" id="pronounControl" style="display:none;">
        <label for="pronounSelect"><b>主語を選んでください:</b></label>
        <select id="pronounSelect" onchange="handlePronounChange()" style="margin-top:6px;">
          <option value="He">He</option>
          <option value="She">She</option>
          <option value="It">It</option>
        </select>
        <p class="pronoun-note">
          He / She は人、It は物や動物について話すときに使います。
        </p>
      </div>

      <div style="margin-top:16px;">
        <b>📚 単語カード（クリックで原稿に入ります）:</b>
        <div class="card-deck" id="cardDeck"></div>
      </div>

      <div style="margin-top:16px;">
        <label for="customInput"><b>✏️ 自分で英語を入力・変更する:</b></label>
        <input
          id="customInput"
          type="text"
          placeholder="カードを選ぶか、英語を入力してください"
          style="margin-top:6px;"
        >
      </div>
    </div>
  </section>

  <section id="tab-vocab" class="tab-content">
    <div class="step-box">
      <div class="step-title">
        📚 カテゴリ別 単語帳（クリックすると発音が聞けるよ！）
      </div>

      <label for="vocabCategory"><b>ジャンルをえらぶ:</b></label>
      <select id="vocabCategory" onchange="renderVocabCards()" style="margin-top:6px;">
        <option value="all">🌟 すべての単語 (All Words)</option>
        <option value="jobs">👨‍🏫 職業 (Jobs)</option>
        <option value="actions_past">🏃 過去形の動詞 (Past Verbs)</option>
        <option value="actions_present">⚽ 動作 (Actions)</option>
        <option value="places_countries">🗽 場所・国名 (Places & Countries)</option>
        <option value="nouns_things">🍕 名詞 (Nouns)</option>
        <option value="animals">🐾 動物 (Animals)</option>
        <option value="sports">⚽ スポーツ (Sports)</option>
        <option value="food_drinks">🍎 食べ物・飲み物 (Food & Drinks)</option>
        <option value="school">🏫 学校 (School)</option>
        <option value="colors">🎨 色 (Colors)</option>
        <option value="adjectives">😊 様子・気持ち (Adjectives & Feelings)</option>
        <option value="weather">☀️ 天気・季節 (Weather & Seasons)</option>
        <option value="family">👨‍👩‍👧‍👦 家族 (Family)</option>
      </select>

      <div class="card-deck" id="vocabCardDeck"></div>
    </div>
  </section>

  <section id="tab-grammar" class="tab-content">
    <div class="step-box">
      <div class="step-title">📖 小学校でつかえる かんたん文法ガイド</div>
      <p style="margin-top:0;color:var(--muted);">
        スピーチや発表で役立つ文法パターンです。カードをクリックすると例文を読み上げます。
      </p>
      <div class="grammar-list-grid" id="grammarListGrid"></div>
    </div>
  </section>

  <div class="preview-box">
    <div class="preview-title">【原稿プレビュー / Speech Preview】</div>
    <div class="preview-text" id="previewText">
      トピックを選択するとここに英語の例文ができます。
    </div>
    <div class="controls">
      <label class="speed-control" for="speechRate">
        読み上げ速度:
        <input
          id="speechRate"
          type="range"
          min="0.6"
          max="1.2"
          step="0.1"
          value="0.9"
          oninput="updateSpeechRateLabel()"
        >
        <span id="speechRateValue">0.9×</span>
      </label>
      <button class="action-btn btn-speak" type="button" onclick="speakText()">
        🔊 英語をよみあげる
      </button>
      <button class="action-btn btn-copy" type="button" onclick="copyText()">
        📋 原稿をコピーする
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

let currentTopicKey = "";

let toastTimer = null;

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
}

function updateSpeechRateLabel() {
  const rate = Number(document.getElementById("speechRate").value);
  document.getElementById("speechRateValue").textContent = `${rate.toFixed(1)}×`;
}

function getBritishMaleVoice() {
  if (!("speechSynthesis" in window)) return null;

  const voices = window.speechSynthesis.getVoices();
  const maleNameHints = [
    "male", "man", "daniel", "arthur", "george",
    "oliver", "ryan", "lee", "alfie", "fred"
  ];

  return voices.find(voice =>
    /^en-GB$/i.test(voice.lang) &&
    maleNameHints.some(hint => voice.name.toLowerCase().includes(hint))
  ) || null;
}

function speakWithBritishMaleVoice(text) {
  if (!("speechSynthesis" in window)) {
    showToast("このブラウザは音声読み上げに対応していません。");
    return;
  }

  const voice = getBritishMaleVoice();

  if (!voice) {
    showToast("男性のイギリス英語音声が見つかりません。端末の音声設定をご確認ください。");
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voice;
  utterance.lang = "en-GB";
  utterance.rate = Number(document.getElementById("speechRate").value);

  window.speechSynthesis.speak(utterance);
}

function speakSingleWord(text) {
  speakWithBritishMaleVoice(text);
}

function switchTab(tabId) {
  const tabIds = ["speech", "vocab", "grammar"];
  const buttons = document.querySelectorAll(".tab-btn");

  tabIds.forEach((id, index) => {
    buttons[index].classList.toggle("active", id === tabId);
    document.getElementById(`tab-${id}`).classList.toggle("active", id === tabId);
  });

  if (tabId === "vocab") renderVocabCards();
  if (tabId === "grammar") renderGrammarGuide();
}

function createWordCard(card, onSelect) {
  const element = document.createElement("div");
  element.className = "word-card";
  element.setAttribute("role", "button");
  element.setAttribute("tabindex", "0");
  element.setAttribute("aria-label", `${card.en}, ${card.jp}`);
  element.innerHTML = `
    <div class="card-icon">${card.icon}</div>
    <div class="card-en">${card.en}</div>
    <div class="card-kana">${card.kana}</div>
    <div class="card-jp">${card.jp}</div>
  `;

  element.addEventListener("click", onSelect);
  element.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      onSelect();
    }
  });

  return element;
}

function renderVocabCards() {
  const category = document.getElementById("vocabCategory").value;
  const deck = document.getElementById("vocabCardDeck");
  deck.innerHTML = "";

  const words = category === "all"
    ? VOCAB_DATA
    : VOCAB_DATA.filter(item => item.category === category);

  words.forEach(card => {
    deck.appendChild(createWordCard(card, () => speakSingleWord(card.en)));
  });
}

function renderGrammarGuide() {
  const grid = document.getElementById("grammarListGrid");
  if (grid.dataset.rendered === "true") return;

  GRAMMAR_GUIDE_DATA.forEach(item => {
    const element = document.createElement("div");
    element.className = "grammar-item-card";
    element.setAttribute("role", "button");
    element.setAttribute("tabindex", "0");
    element.innerHTML = `
      <div class="grammar-item-tag">${item.tag}</div>
      <div class="grammar-item-pat">${item.pattern}</div>
      <div style="margin-top:4px;font-size:14px;font-weight:bold;color:#2D3748;">
        例: ${item.example}
      </div>
      <div class="grammar-item-jp">${item.jp}</div>
    `;

    const readExample = () => speakSingleWord(item.example);
    element.addEventListener("click", readExample);
    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        readExample();
      }
    });

    grid.appendChild(element);
  });

  grid.dataset.rendered = "true";
}

function getCurrentGrammar() {
  if (!currentTopicKey || currentReasonIndex === null) return "";

  const reason = TOPICS[currentTopicKey].reasons[currentReasonIndex];
  return reason.grammar.replace(/SUBJECT/g, currentPronoun);
}

function updateGrammarPattern() {
  const grammarBox = document.getElementById("grammarBox");

  grammarBox.innerHTML = `
    <div>【使いたい文法パターン】</div>
    <div class="grammar-hint">${getCurrentGrammar()}</div>
  `;
}

function handlePronounChange() {
  currentPronoun = document.getElementById("pronounSelect").value;
  updateGrammarPattern();
  renderSpeech();
}

function selectTopic(key, button) {
  currentTopicKey = key;
  currentReasonIndex = null;
  currentSelectedWord = "";
  document.getElementById("customInput").value = "";

  document.querySelectorAll(".topic-btn").forEach(item => {
    item.classList.remove("active");
  });
  button.classList.add("active");

  const topic = TOPICS[key];
  const reasonGrid = document.getElementById("reasonGrid");
  reasonGrid.innerHTML = "";

  topic.reasons.forEach((reason, index) => {
    const reasonButton = document.createElement("button");
    reasonButton.type = "button";
    reasonButton.className = "reason-btn";
    reasonButton.textContent = `💡 ${reason.jp}`;
    reasonButton.addEventListener("click", () => selectReason(index));
    reasonGrid.appendChild(reasonButton);
  });

  document.getElementById("step2").style.display = "block";
  document.getElementById("step3").style.display = "none";
  document.getElementById("pronounControl").style.display = "none";

  updatePreview(`${topic.intro}\n\n(STEP 2で内容をえらんでね)`);
}

function selectReason(index) {
  currentReasonIndex = index;
  currentSelectedWord = "";
  currentPronoun = "He";
  document.getElementById("customInput").value = "";

  const topic = TOPICS[currentTopicKey];
  const reason = topic.reasons[index];

  document.querySelectorAll(".reason-btn").forEach((button, i) => {
    button.classList.toggle("active", i === index);
  });

  const pronounControl = document.getElementById("pronounControl");
  const pronounSelect = document.getElementById("pronounSelect");

  if (reason.subjectChoice) {
    pronounControl.style.display = "block";
    pronounSelect.value = currentPronoun;
  } else {
    pronounControl.style.display = "none";
  }

  updateGrammarPattern();

  const deck = document.getElementById("cardDeck");
  deck.innerHTML = "";

  reason.cards.forEach(card => {
    const cardElement = createWordCard(card, () => {
      document.querySelectorAll("#cardDeck .word-card").forEach(item => {
        item.classList.remove("selected");
        item.setAttribute("aria-selected", "false");
      });

      cardElement.classList.add("selected");
      cardElement.setAttribute("aria-selected", "true");
      currentSelectedWord = card.en;
      document.getElementById("customInput").value = card.en;

      speakSingleWord(card.en);
      renderSpeech();
    });

    cardElement.setAttribute("aria-selected", "false");
    deck.appendChild(cardElement);
  });

  document.getElementById("step3").style.display = "block";
  renderSpeech();
}

document.getElementById("customInput").addEventListener("input", event => {
  currentSelectedWord = event.target.value;

  document.querySelectorAll("#cardDeck .word-card").forEach(card => {
    card.classList.remove("selected");
    card.setAttribute("aria-selected", "false");
  });

  renderSpeech();
});

function renderSpeech() {
  if (!currentTopicKey || currentReasonIndex === null) return;

  const topic = TOPICS[currentTopicKey];
  let sentence = getCurrentGrammar();

  if (currentSelectedWord.trim()) {
    sentence = sentence.replace(/\[[^\]]*\]/, currentSelectedWord.trim());
  }

  updatePreview(`${topic.intro}\n${sentence}\nThank you for listening.`);
}

function updatePreview(text) {
  document.getElementById("previewText").textContent = text;
}

function speakText() {
  speakWithBritishMaleVoice(document.getElementById("previewText").textContent);
}

function copyText() {
  const text = document.getElementById("previewText").textContent;

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showToast("📋 原稿をコピーしました！"))
      .catch(() => fallbackCopyText(text));
  } else {
    fallbackCopyText(text);
  }
}

function fallbackCopyText(text) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";
  document.body.appendChild(textarea);
  textarea.select();

  try {
    const copied = document.execCommand("copy");
    showToast(copied ? "📋 原稿をコピーしました！" : "コピーに失敗しました。");
  } catch (error) {
    showToast("コピーに失敗しました。");
  } finally {
    document.body.removeChild(textarea);
  }
}

updateSpeechRateLabel();

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}
</script>
