<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外国語 スピーチ・発表サポーター</title>
  <style>
    :root {
      --primary: #2B6CB0;
      --primary-light: #EBF8FF;
      --secondary: #DD6B20;
      --secondary-light: #FFFAF0;
      --accent-green: #38A169;
      --accent-green-hover: #2F855A;
      --bg: #EDF2F7;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --text-muted: #718096;
      --border-color: #CBD5E0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial,
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 24px;
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      background: #E2E8F0;
      border: 0;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      color: #4A5568;
      white-space: nowrap;
    }

    .tab-btn:hover { background: #CBD5E0; }
    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .step-box {
      background: var(--primary-light);
      border-left: 6px solid var(--primary);
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .step-title {
      font-weight: bold;
      font-size: 18px;
      color: #1A365D;
      margin-bottom: 12px;
    }

    select, input[type="text"] {
      font-size: 16px;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: #FFF;
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(43,108,176,.2);
    }

    .topic-grid, .reason-grid, .grammar-list-grid {
      display: grid;
      gap: 12px;
    }

    .topic-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .reason-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

    .topic-btn, .reason-btn {
      background: #FFF;
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
    }

    .topic-btn:hover, .reason-btn:hover { background: #E2E8F0; }
    .topic-btn.active, .reason-btn.active { background: var(--primary); color: #FFF; }

    .grammar-box {
      background: var(--secondary-light);
      border: 2px dashed var(--secondary);
      padding: 16px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .grammar-hint {
      font-size: 20px;
      font-weight: bold;
      color: #C05621;
      margin-top: 4px;
    }

    .card-deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .word-card {
      background: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform .1s, border-color .2s, box-shadow .2s;
      user-select: none;
    }

    .word-card:hover, .word-card:focus {
      transform: translateY(-2px);
      border-color: var(--secondary);
      outline: none;
    }

    .word-card.selected {
      border-color: var(--secondary);
      background: var(--secondary-light);
      box-shadow: 0 0 8px rgba(221,107,32,.4);
    }

    .card-icon { font-size: 32px; margin-bottom: 4px; }
    .card-en { font-weight: bold; font-size: 17px; }
    .card-kana { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .card-jp { font-size: 13px; color: var(--primary); font-weight: bold; }

    .preview-box {
      background: #2D3748;
      color: #FFF;
      padding: 20px;
      border-radius: 12px;
      margin-top: 24px;
    }

    .preview-title { font-size: 16px; color: #A0AEC0; margin-bottom: 8px; }
    .preview-text {
      font-size: 20px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .action-btn:active { transform: scale(.98); }
    .btn-speak { background: var(--accent-green); color: white; }
    .btn-speak:hover { background: var(--accent-green-hover); }
    .btn-copy { background: #4299E1; color: white; }
    .btn-copy:hover { background: #3182CE; }

    .speed-control {
      flex: 1 1 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: bold;
      color: white;
    }

    .speed-control input {
      flex: 1;
      min-width: 140px;
      accent-color: #68D391;
    }

    .grammar-list-grid {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      margin-top: 12px;
    }

    .grammar-item-card {
      background: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: transform .1s, border-color .2s;
    }

    .grammar-item-card:hover, .grammar-item-card:focus {
      transform: translateY(-2px);
      border-color: var(--primary);
      outline: none;
    }

    .grammar-item-tag {
      font-size: 12px;
      background: var(--secondary-light);
      color: var(--secondary);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
    }

    .grammar-item-pat { font-size: 16px; font-weight: bold; color: var(--primary); }
    .grammar-item-jp { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2D3748;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      font-weight: bold;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 1000;
      width: max-content;
      max-width: calc(100% - 32px);
    }

    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .container { padding: 16px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎤 小学校外国語 スピーチ・発表サポーター</h1>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('speech')">🎤 スピーチ作成</button>
    <button class="tab-btn" onclick="switchTab('vocab')">📚 索引・単語帳</button>
    <button class="tab-btn" onclick="switchTab('grammar')">📖 かんたん文法ガイド</button>
  </div>

  <div id="tab-speech" class="tab-content active">

      <div class="step-title">STEP 1: はっぴょうするトピックをえらぼう</div>

        <button class="topic-btn" onclick="selectTopic('dream', this)">✨ 将来の夢 (My Future Dream)</button>
        <button class="topic-btn" onclick="selectTopic('memories', this)">🏫 小学校の思い出 (My Memories)</button>
        <button class="topic-btn" onclick="selectTopic('can', this)">⚽ できること・得意なこと (What I Can Do)</button>
        <button class="topic-btn" onclick="selectTopic('favorites', this)">🍕 好きなもの・季節 (My Favorites)</button>
        <button class="topic-btn" onclick="selectTopic('town', this)">🏙️ わたしの町・学校紹介 (My Town & School)</button>
        <button class="topic-btn" onclick="selectTopic('weekend', this)">📅 週末・休日の過ごし方 (My Weekend)</button>
        <button class="topic-btn" onclick="selectTopic('hero', this)">👨‍👩‍👧‍👦 家族・お友達の紹介 (My Hero / Family)</button>
        <button class="topic-btn" onclick="selectTopic('world', this)">🌏 行ってみたい国 (Countries I Want to Visit)</button>
      </div>
    </div>

    <div class="step-box" id="step2" style="display:none;">
      <div class="step-title">STEP 2: つたえたい内容をえらぼう（日本語）</div>
      <div class="reason-grid" id="reasonGrid"></div>
    </div>

    <div class="step-box" id="step3" style="display:none;">
      <div class="step-title">STEP 3: えいごのぶんぽうパターンと単語カード</div>
      <div class="grammar-box" id="grammarBox"></div>
      <div style="margin-top:16px;">
        <b>📚 つかえる単語カード（クリックで単語が入ります）:</b>
        <div class="card-deck" id="cardDeck"></div>
      </div>
      <div style="margin-top:16px;">
        <label for="customInput"><b>✏️ 自分で自由に入力する（または変更する）:</b></label>
        <input type="text" id="customInput" placeholder="カードを選ぶか、直接英語を入力" style="margin-top:6px;">
      </div>
    </div>
  </div>

  <div id="tab-vocab" class="tab-content">
    <div class="step-box">
      <div class="step-title">📚 カテゴリ別 単語帳（クリックすると発音が聞けるよ！）</div>
      <div style="margin-bottom:12px;">
        <label for="vocabCategory"><b>ジャンルをえらぶ:</b></label>
        <select id="vocabCategory" onchange="renderVocabCards()" style="margin-top:6px;">
          <option value="all">🌟 すべての単語 (All Words)</option>
          <option value="jobs">👨‍🏫 職業・なりたいもの (Jobs)</option>
          <option value="actions_past">🏃 過去形の動詞 (Past Verbs)</option>
          <option value="actions_present">⚽ 動作・現在形 (Verbs / Present)</option>
          <option value="places_countries">🗽 場所・国名 (Places & Countries)</option>
          <option value="nouns_things">🍕 食べ物・季節・名詞 (Nouns)</option>
        </select>
      </div>
      <div class="card-deck" id="vocabCardDeck"></div>
    </div>
  </div>

  <div id="tab-grammar" class="tab-content">
    <div class="step-box">
      <div class="step-title">📖 小学校でつかえる かんたん文法ガイド</div>
      <p style="margin-top:0;color:var(--text-muted);">
        スピーチや発表で役立つ基本の文法パターンです。クリックすると例文が読み上げられます！
      </p>
      <div class="grammar-list-grid" id="grammarListGrid"></div>
    </div>
  </div>

  <div class="preview-box">
    <div class="preview-title">【原稿プレビュー / Speech Preview】</div>
    <div class="preview-text" id="previewText">トピックを選択するとここに英語の例文ができます。</div>
    <div class="controls">
      <label class="speed-control" for="speechRate">
        Prędkość czytania:
        <input
          type="range"
          id="speechRate"
          min="0.6"
          max="1.2"
          step="0.1"
          value="0.85"
          oninput="updateSpeechRateLabel()"
        >
        <span id="speechRateValue">0.9×</span>
      </label>
      <button class="action-btn btn-speak" onclick="speakText()">🔊 英語をよみあげる</button>
      <button class="action-btn btn-copy" onclick="copyText()">📋 原稿をコピーする</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

  { tag: "過去のこと", pattern: "I [ 過去形の動詞 ].", example: "I played basketball.", jp: "私は〜しました。" },
  { tag: "思い出", pattern: "I enjoyed [ 名詞 ].", example: "I enjoyed the school trip.", jp: "私は〜を楽しみました。" },
  { tag: "一番好きなもの", pattern: "My favorite season is [ 季節 ].", example: "My favorite season is spring.", jp: "私の一番好きな季節は〜です。" },
  { tag: "住んでいる場所", pattern: "I live in [ 場所 ].", example: "I live in Tokyo.", jp: "私は〜に住んでいます。" },
  { tag: "町の紹介", pattern: "There is [ 場所 ] in my town.", example: "There is a big park in my town.", jp: "私の町には〜があります。" },
  { tag: "週末の習慣", pattern: "I usually [ 動詞 ] on weekends.", example: "I usually read books on weekends.", jp: "私は週末によく〜します。" },
  { tag: "行きたい場所", pattern: "I want to go to [ 場所 ].", example: "I want to go to France.", jp: "私は〜へ行きたいです。" },
  { tag: "人物の紹介", pattern: "He / She is very [ 形容詞 ].", example: "She is very kind.", jp: "彼／彼女はとても〜です。" },
  { tag: "尊敬する人", pattern: "I admire [ 人 ].", example: "I admire my mother.", jp: "私は〜を尊敬しています。" },
  { tag: "理由", pattern: "Because it is [ 形容詞 ].", example: "Because it is exciting.", jp: "なぜなら、それは〜だからです。" },
  { tag: "お礼", pattern: "Thank you for listening.", example: "Thank you for listening.", jp: "聞いてくれてありがとうございます。" }
];

let currentTopicKey = "";
let currentReasonIndex = null;
let currentSelectedWord = "";
let toastTimer = null;

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
}

function updateSpeechRateLabel() {
  const rate = Number(document.getElementById("speechRate").value);
  document.getElementById("speechRateValue").textContent = `${rate.toFixed(1)}×`;
}

function getBritishMaleVoice() {
  if (!("speechSynthesis" in window)) return null;

  const voices = window.speechSynthesis.getVoices();
  const maleNameHints = [
    "male", "man", "daniel", "arthur", "george",
    "oliver", "ryan", "lee", "alfie", "fred"
  ];

  return voices.find(voice =>
    /^en-GB$/i.test(voice.lang) &&
    maleNameHints.some(hint => voice.name.toLowerCase().includes(hint))
  ) || null;
}

function speakWithBritishMaleVoice(text) {
  if (!("speechSynthesis" in window)) {
    showToast("このブラウザは音声読み上げに対応していません。");
    return;
  }

  const voice = getBritishMaleVoice();
  if (!voice) {
    showToast("男性のイギリス英語音声がありません。端末に音声を追加してください。");
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voice;
  utterance.lang = "en-GB";
  utterance.rate = Number(document.getElementById("speechRate").value);
  window.speechSynthesis.speak(utterance);
}

function speakSingleWord(text) {
  speakWithBritishMaleVoice(text);
}

function switchTab(tabId) {
  ["speech", "vocab", "grammar"].forEach((id, index) => {
    document.querySelectorAll(".tab-btn")[index].classList.toggle("active", id === tabId);
    document.getElementById(`tab-${id}`).classList.toggle("active", id === tabId);
  });

  if (tabId === "vocab") renderVocabCards();
  if (tabId === "grammar") renderGrammarGuide();
}

function makeWordCard(card, onSelect, selected = false) {
  const cardEl = document.createElement("div");
  cardEl.className = `word-card${selected ? " selected" : ""}`;
  cardEl.setAttribute("role", "button");
  cardEl.setAttribute("tabindex", "0");
  cardEl.setAttribute("aria-label", `${card.en}, ${card.jp}`);
  cardEl.innerHTML = `
    <div class="card-icon">${card.icon}</div>
    <div class="card-en">${card.en}</div>
    <div class="card-kana">${card.kana}</div>
    <div class="card-jp">${card.jp}</div>
  `;

  cardEl.addEventListener("click", onSelect);
  cardEl.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      onSelect();
    }
  });
  return cardEl;
}

function renderVocabCards() {
  const category = document.getElementById("vocabCategory").value;
  const deck = document.getElementById("vocabCardDeck");
  deck.innerHTML = "";

  const filtered = category === "all"
    ? VOCAB_DATA
    : VOCAB_DATA.filter(item => item.category === category);

  filtered.forEach(card => {
    deck.appendChild(makeWordCard(card, () => speakSingleWord(card.en)));
  });
}

function renderGrammarGuide() {
  const grid = document.getElementById("grammarListGrid");
  if (grid.innerHTML.trim()) return;

  GRAMMAR_GUIDE_DATA.forEach(item => {
    const el = document.createElement("div");
    el.className = "grammar-item-card";
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.title = "クリックすると発音します";
    el.innerHTML = `
      <div class="grammar-item-tag">${item.tag}</div>
      <div class="grammar-item-pat">${item.pattern}</div>
      <div style="font-size:14px;font-weight:bold;color:#2D3748;margin-top:4px;">
        例: ${item.example}
      </div>
      <div class="grammar-item-jp">${item.jp}</div>
    `;

    const readExample = () => speakSingleWord(item.example);
    el.addEventListener("click", readExample);
    el.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        readExample();
      }
    });
    grid.appendChild(el);
  });
}

function selectTopic(key, button) {
  currentTopicKey = key;
  currentReasonIndex = null;
  currentSelectedWord = "";
  document.getElementById("customInput").value = "";

  document.querySelectorAll(".topic-btn").forEach(btn => btn.classList.remove("active"));
  button.classList.add("active");

  const topic = TOPICS[key];
  const reasonGrid = document.getElementById("reasonGrid");
  reasonGrid.innerHTML = "";

  topic.reasons.forEach((reason, index) => {
    const btn = document.createElement("button");
    btn.className = "reason-btn";
    btn.textContent = `💡 ${reason.jp}`;
    btn.addEventListener("click", () => selectReason(index));
    reasonGrid.appendChild(btn);
  });

  document.getElementById("step2").style.display = "block";
  document.getElementById("step3").style.display = "none";
  updatePreview(`${topic.intro}\n\n(STEP 2で内容をえらんでね)`);
}

function selectReason(index) {
  currentReasonIndex = index;
  currentSelectedWord = "";
  document.getElementById("customInput").value = "";

  const topic = TOPICS[currentTopicKey];
  const reason = topic.reasons[index];

  document.querySelectorAll(".reason-btn").forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });

  document.getElementById("grammarBox").innerHTML = `
    <div>【使いたい文法パターン】</div>
    <div class="grammar-hint">${reason.grammar}</div>
  `;

  const deck = document.getElementById("cardDeck");
  deck.innerHTML = "";

  reason.cards.forEach(card => {
    const cardEl = makeWordCard(card, () => {
      document.querySelectorAll("#cardDeck .word-card").forEach(item => {
        item.classList.remove("selected");
        item.setAttribute("aria-selected", "false");
      });

      cardEl.classList.add("selected");
      cardEl.setAttribute("aria-selected", "true");
      currentSelectedWord = card.en;
      document.getElementById("customInput").value = card.en;
      speakSingleWord(card.en);
      renderSpeech();
    });

    cardEl.setAttribute("aria-selected", "false");
    deck.appendChild(cardEl);
  });

  document.getElementById("step3").style.display = "block";
  renderSpeech();
}

document.getElementById("customInput").addEventListener("input", event => {
  currentSelectedWord = event.target.value;
  document.querySelectorAll("#cardDeck .word-card").forEach(card => {
    card.classList.remove("selected");
    card.setAttribute("aria-selected", "false");
  });
  renderSpeech();
});

function renderSpeech() {
  if (!currentTopicKey || currentReasonIndex === null) return;

  const topic = TOPICS[currentTopicKey];
  const reason = topic.reasons[currentReasonIndex];
  let line = reason.grammar;

  if (currentSelectedWord.trim()) {
    if (line.includes("[") && line.includes("]")) {
      line = line.replace(/\[[^\]]*\]/, currentSelectedWord.trim());
    } else if (currentTopicKey === "favorites" && reason.jp.includes("一番好きなもの")) {
      line = currentSelectedWord.trim();
    }
  }

  updatePreview(`${topic.intro}\n${line}\nThank you for listening.`);
}

function updatePreview(text) {
  document.getElementById("previewText").innerText = text;
}

function speakText() {
  speakWithBritishMaleVoice(document.getElementById("previewText").innerText);
}

function copyText() {
  const text = document.getElementById("previewText").innerText;

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showToast("📋 原稿をコピーしました！"))
      .catch(() => fallbackCopyText(text));
  } else {
    fallbackCopyText(text);
  }
}

function fallbackCopyText(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-9999px";
  document.body.appendChild(textArea);
  textArea.select();

  try {
    const copied = document.execCommand("copy");
    showToast(copied ? "📋 原稿をコピーしました！" : "コピーに失敗しました。");
  } catch (error) {
    showToast("コピーに失敗しました。");
  } finally {
    document.body.removeChild(textArea);
  }
}

updateSpeechRateLabel();

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}
</script>
