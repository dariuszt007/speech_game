<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外国語 スピーチ・発表サポーター</title>
  <style>
    :root {
      --primary: #2B6CB0;
      --primary-light: #EBF8FF;
      --secondary: #DD6B20;
      --secondary-light: #FFFAF0;
      --green: #38A169;
      --bg: #EDF2F7;
      --text: #2D3748;
      --muted: #718096;
      --border: #CBD5E0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial,
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.55;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 18px;
      color: var(--primary);
      font-size: 23px;
      text-align: center;
    }

    .tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      overflow-x: auto;
      border-bottom: 2px solid var(--border);
    }

    .tab-btn {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #E2E8F0;
      color: #4A5568;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .section { display: none; }
    .section.active { display: block; }

    .step-box {
      margin-bottom: 18px;
      padding: 16px;
      border-left: 6px solid var(--primary);
      border-radius: 8px;
      background: var(--primary-light);
    }

    .step-title {
      margin-bottom: 12px;
      color: #1A365D;
      font-size: 18px;
      font-weight: 700;
    }

    .topic-grid, .reason-grid, .card-deck {
      display: grid;
      gap: 10px;
    }

    .topic-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .reason-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card-deck { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }

    button { font: inherit; }

    .topic-btn, .reason-btn {
      padding: 13px;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: #fff;
      color: var(--primary);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .topic-btn.active, .reason-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .grammar-box {
      margin-top: 12px;
      padding: 14px;
      border: 2px dashed var(--secondary);
      border-radius: 8px;
      background: var(--secondary-light);
    }

    .grammar-hint {
      margin-top: 4px;
      color: #C05621;
      font-size: 20px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    select, input[type="text"] {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
    }

    select:focus, input:focus, button:focus-visible {
      outline: 3px solid rgba(43,108,176,.28);
      outline-offset: 2px;
    }

    .card-btn {
      min-width: 0;
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #fff;
      text-align: center;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .card-btn:hover, .card-btn.selected {
      border-color: var(--secondary);
      background: var(--secondary-light);
    }

    .card-icon {
      margin-bottom: 5px;
      font-size: 30px;
    }

    .card-en { font-weight: 700; }
    .card-kana { color: var(--muted); font-size: 12px; }
    .card-jp { color: var(--primary); font-size: 13px; font-weight: 700; }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #2D3748;
      color: #fff;
    }

    .preview-title {
      margin-bottom: 8px;
      color: #A0AEC0;
    }

    .preview-text {
      min-height: 70px;
      font-size: 19px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .rate-control {
      display: flex;
      flex: 1 1 100%;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .rate-control input {
      flex: 1;
      min-width: 110px;
      accent-color: #68D391;
    }

    .action-btn {
      flex: 1 1 160px;
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: #4299E1;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-green { background: var(--green); }
    .btn-green:hover { background: #2F855A; }
    .btn-purple { background: #805AD5; }
    .btn-red { background: #E53E3E; }

    .toast {
      position: fixed;
      z-index: 5;
      right: 16px;
      bottom: 20px;
      left: 16px;
      width: max-content;
      max-width: calc(100% - 32px);
      margin: auto;
      padding: 11px 18px;
      border-radius: 8px;
      background: #2D3748;
      color: #fff;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      body { padding: 7px; }
      .container { padding: 14px; }
      h1 { font-size: 20px; }
      .step-box { padding: 13px; }
      .preview-box { padding: 15px; }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>🎤 小学校外国語 スピーチ・発表サポーター</h1>

  <nav class="tab-nav" aria-label="メインメニュー">
    <button class="tab-btn active" type="button" data-tab="speech">🎤 スピーチ作成</button>
    <button class="tab-btn" type="button" data-tab="vocab">📚 単語カード</button>
    <button class="tab-btn" type="button" data-tab="progress">⭐ 学習記録</button>
  </nav>

  <main>
    <section id="section-speech" class="section active">
      <div class="step-box">
        <div class="step-title">STEP 1: トピックをえらぼう</div>
        <div id="topicGrid" class="topic-grid"></div>
      </div>

      <div id="reasonStep" class="step-box" style="display:none;">
        <div class="step-title">STEP 2: はなしたい内容をえらぼう</div>
        <div id="reasonGrid" class="reason-grid"></div>
      </div>

      <div id="builderStep" class="step-box" style="display:none;">
        <div class="step-title">STEP 3: 文を作ろう</div>

        <div id="grammarBox" class="grammar-box"></div>

        <div id="pronounControl" style="display:none;margin-top:14px;">
          <label for="pronounSelect"><b>主語をえらぼう:</b></label>
          <select id="pronounSelect" style="margin-top:6px;">
            <option value="He">He</option>
            <option value="She">She</option>
            <option value="It">It</option>
          </select>
          <p class="hint">He / She は人、It は物や動物について使います。</p>
        </div>

        <div id="countryPicker" style="display:none;margin-top:14px;">
          <label for="countrySelect"><b>🌍 国をえらぼう:</b></label>
          <select id="countrySelect" style="margin-top:6px;">
            <option value="">国をえらんでください</option>
          </select>
          <p class="hint">国によってカタカナ表記がない場合があります。</p>
        </div>

        <p style="margin:16px 0 6px;"><b>📚 単語カード（クリックで原稿に入ります）:</b></p>
        <div id="cardDeck" class="card-deck"></div>

        <div style="margin-top:16px;">
          <label for="customInput"><b>✏️ 自分で英語を入力・変更する:</b></label>
          <input id="customInput" type="text"
            placeholder="単語カードを選ぶか、英語を入力してください"
            style="margin-top:6px;">
        </div>

        <div class="controls">
          <button id="hintButton" class="action-btn btn-purple" type="button">💡 ヒントを見る</button>
          <button id="addSentenceButton" class="action-btn btn-green" type="button">
            ➕ この文をスピーチに追加
          </button>
        </div>

        <div id="hintBox" class="grammar-box" style="display:none;">
          <b>ヒント</b>
          <p id="hintText" style="margin-bottom:0;"></p>
        </div>
      </div>

      <div class="preview-box">
        <div class="preview-title">【スピーチ / Speech】</div>
        <div id="speechText" class="preview-text">トピックと内容を選ぶと、ここにスピーチが表示されます。</div>

        <div class="controls">
          <label class="rate-control" for="speechRate">
            読み上げ速度:
            <input id="speechRate" type="range" min="0.6" max="1.2"
              step="0.1" value="0.9">
            <span id="speechRateValue">0.9×</span>
          </label>
          <button id="readSpeechButton" class="action-btn btn-green" type="button">🔊 スピーチを聞く</button>
          <button id="copySpeechButton" class="action-btn" type="button">📋 コピー</button>
          <button id="clearSpeechButton" class="action-btn btn-red" type="button">🗑️ スピーチを消す</button>
        </div>
      </div>
    </section>

    <section id="section-vocab" class="section">
      <div class="step-box">
        <div class="step-title">📚 単語カード</div>
        <label for="vocabCategory"><b>ジャンルをえらぼう:</b></label>
        <select id="vocabCategory" style="margin-top:6px;">
          <option value="all">すべて</option>
          <option value="countries">国</option>
          <option value="other">その他の単語</option>
        </select>
        <div id="vocabDeck" class="card-deck"></div>
      </div>
    </section>

    <section id="section-progress" class="section">
      <div class="step-box">
        <div class="step-title">⭐ 学習記録</div>
        <p>スピーチに追加した文の数: <b id="progressSentences">0</b></p>
        <button id="resetProgressButton" class="action-btn btn-red" type="button">
          学習記録をリセット
        </button>
        <p class="hint">記録はこの端末のブラウザーに保存されます。</p>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

  GB: "the United Kingdom",
  US: "the United States"
};

const EN_NAMES = new Intl.DisplayNames(["en"], { type: "region" });
const JA_NAMES = new Intl.DisplayNames(["ja"], { type: "region" });

function countryFlag(code) {
  return [...code.toUpperCase()]
    .map(char => String.fromCodePoint(char.charCodeAt(0) + 127397))
    .join("");
}

const COUNTRIES = COUNTRY_CODES.map(code => ({
  code,
  english: EN_NAMES.of(code) || code,
  japanese: JA_NAMES.of(code) || code,
  kana: COUNTRY_KANA[code] || ""
})).sort((a, b) => a.english.localeCompare(b.english, "en"));

function countrySpeechName(country) {
  return COUNTRY_ARTICLES[country.code] || country.english;
}

        cards: [
          ["🇺🇸", "the United States", "アメリカ", "アメリカ合衆国"],
          ["🇫🇷", "France", "フランス", "フランス"],
          ["🇦🇺", "Australia", "オーストラリア", "オーストラリア"],
          ["🇬🇧", "the United Kingdom", "ユナイテッド キングダム", "イギリス"],

          ["🇩🇪", "Germany", "ジャーマニー", "ドイツ"],
          ["🇪🇸", "Spain", "スペイン", "スペイン"],

      {

const EXTRA_VOCAB = [
  ["🏊", "swim", "スウィム", "泳ぐ"],
  ["📖", "read books", "リード ブックス", "本を読む"],
  ["⚽", "play soccer", "プレイ サッカー", "サッカーをする"],
  ["🤝", "help people", "ヘルプ ピープル", "人を助ける"],
  ["🐱", "cats", "キャッツ", "猫"],
  ["🎵", "music", "ミュージック", "音楽"],
  ["🍣", "sushi", "スシ", "すし"],
  ["🌸", "spring", "スプリング", "春"],
  ["🌞", "summer", "サマー", "夏"],
  ["⛄", "winter", "ウィンター", "冬"],
  ["💖", "kind", "カインド", "やさしい"],
  ["😊", "funny", "ファニー", "おもしろい"]
];

let currentTopicKey = "";
let currentReasonIndex = null;
let currentPronoun = "He";
let speechLines = [];
let progress = loadProgress();
let toastTimer = null;

function loadProgress() {
  const defaultProgress = { sentencesAdded: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem("englishLearningProgress"));
    return saved ? { ...defaultProgress, ...saved } : defaultProgress;
  } catch {
    return defaultProgress;
  }
}

function saveProgress() {
  try {
    localStorage.setItem("englishLearningProgress", JSON.stringify(progress));
  } catch {
    showToast("学習記録を保存できませんでした。");
  }
  updateProgressDisplay();
}

function updateProgressDisplay() {
  document.getElementById("progressSentences").textContent = progress.sentencesAdded;
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

function showSection(name) {
  document.querySelectorAll(".tab-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === name);
  });

  document.querySelectorAll(".section").forEach(section => {
    section.classList.toggle("active", section.id === `section-${name}`);
  });

  if (name === "progress") updateProgressDisplay();
  if (name === "vocab") renderVocab();
}

document.querySelectorAll(".tab-btn").forEach(button => {
  button.addEventListener("click", () => showSection(button.dataset.tab));
});

function buildTopicButtons() {
  const grid = document.getElementById("topicGrid");

  Object.entries(TOPICS).forEach(([key, topic]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "topic-btn";
    button.textContent = topic.label;
    button.addEventListener("click", () => chooseTopic(key, button));
    grid.appendChild(button);
  });
}

function chooseTopic(key, button) {
  currentTopicKey = key;
  currentReasonIndex = null;

  document.querySelectorAll(".topic-btn").forEach(item => item.classList.remove("active"));
  button.classList.add("active");

  const grid = document.getElementById("reasonGrid");
  grid.innerHTML = "";

  TOPICS[key].reasons.forEach((reason, index) => {
    const reasonButton = document.createElement("button");
    reasonButton.type = "button";
    reasonButton.className = "reason-btn";
    reasonButton.textContent = `💡 ${reason.jp}`;
    reasonButton.addEventListener("click", () => chooseReason(index));
    grid.appendChild(reasonButton);
  });

  document.getElementById("reasonStep").style.display = "block";
  document.getElementById("builderStep").style.display = "none";

  // Topic を変えたら、新しいスピーチを作り始める
  speechLines = [];
  renderSpeech();
}

function chooseReason(index) {
  currentReasonIndex = index;
  currentPronoun = "He";

  const reason = TOPICS[currentTopicKey].reasons[index];

  document.querySelectorAll(".reason-btn").forEach((button, i) => {
    button.classList.toggle("active", i === index);
  });

  document.getElementById("builderStep").style.display = "block";
  document.getElementById("customInput").value = "";
  document.getElementById("hintBox").style.display = "none";
  document.getElementById("hintButton").textContent = "💡 ヒントを見る";

  document.getElementById("pronounControl").style.display =
    reason.subjectChoice ? "block" : "none";
  document.getElementById("countryPicker").style.display =
    reason.countryChoice ? "block" : "none";

  if (reason.subjectChoice) {
    document.getElementById("pronounSelect").value = "He";
  }

  if (reason.countryChoice) {
    fillCountryMenu();
    document.getElementById("countrySelect").value = "";
  }

  renderGrammar();
  renderCards(reason.cards);
  updateHintText();
}

function fillCountryMenu() {
  const select = document.getElementById("countrySelect");
  if (select.dataset.loaded === "true") return;

  COUNTRIES.forEach(country => {
    const option = document.createElement("option");
    const kanaText = country.kana ? ` — ${country.kana}` : "";

    option.value = countrySpeechName(country);
    option.textContent =
      `${countryFlag(country.code)} ${country.english}${kanaText}（${country.japanese}）`;

    select.appendChild(option);
  });

  select.dataset.loaded = "true";
}

function renderGrammar() {
  if (!currentTopicKey || currentReasonIndex === null) return;

  const reason = TOPICS[currentTopicKey].reasons[currentReasonIndex];
  const grammar = reason.grammar.replace(/SUBJECT/g, currentPronoun);
  const box = document.getElementById("grammarBox");

  box.replaceChildren();

  const label = document.createElement("div");
  label.textContent = "【使いたい文法パターン】";

  const pattern = document.createElement("div");
  pattern.className = "grammar-hint";
  pattern.textContent = grammar;

  box.append(label, pattern);
}

function renderCards(cards) {
  const deck = document.getElementById("cardDeck");
  deck.innerHTML = "";

  cards.forEach(([icon, english, kana, japanese]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "card-btn";

    const iconDiv = document.createElement("div");
    iconDiv.className = "card-icon";
    iconDiv.textContent = icon;

    const englishDiv = document.createElement("div");
    englishDiv.className = "card-en";
    englishDiv.textContent = english;

    const kanaDiv = document.createElement("div");
    kanaDiv.className = "card-kana";
    kanaDiv.textContent = kana;

    const japaneseDiv = document.createElement("div");
    japaneseDiv.className = "card-jp";
    japaneseDiv.textContent = japanese;

    button.append(iconDiv, englishDiv, kanaDiv, japaneseDiv);

    button.addEventListener("click", () => {
      document.getElementById("customInput").value = english;
      selectWord(english);
      deck.querySelectorAll(".card-btn").forEach(card => card.classList.remove("selected"));
      button.classList.add("selected");
      speakEnglish(english);
    });

    deck.appendChild(button);
  });
}

function selectWord(word) {
  if (!currentTopicKey || currentReasonIndex === null) return;

  const reason = TOPICS[currentTopicKey].reasons[currentReasonIndex];
  if (reason.countryChoice) {
    const country = COUNTRIES.find(item => countrySpeechName(item) === word);
    document.getElementById("countrySelect").value = country ? word : "";
  }

  updateHintText();
}

function currentSentence() {
  if (!currentTopicKey || currentReasonIndex === null) return "";

  const reason = TOPICS[currentTopicKey].reasons[currentReasonIndex];
  let sentence = reason.grammar.replace(/SUBJECT/g, currentPronoun);
  const word = document.getElementById("customInput").value.trim();

  if (word) sentence = sentence.replace(/\[[^\]]*\]/, word);
  return sentence;
}

function updateHintText() {
  if (!currentTopicKey || currentReasonIndex === null) return;

  const reason = TOPICS[currentTopicKey].reasons[currentReasonIndex];
  const match = reason.grammar.match(/\[([^\]]+)\]/);
  const slot = match ? match[1] : "文";
  const word = document.getElementById("customInput").value.trim();

  document.getElementById("hintText").textContent = word
    ? `「${word}」を文の [${slot}] に入れて、文全体を読んでみましょう。`
    : (reason.hint || `文の [${slot}] に入る英語を考えてみましょう。`);
}

document.getElementById("pronounSelect").addEventListener("change", event => {
  currentPronoun = event.target.value;
  renderGrammar();
});

document.getElementById("countrySelect").addEventListener("change", event => {
  if (!event.target.value) return;

  document.getElementById("customInput").value = event.target.value;
  selectWord(event.target.value);
});

document.getElementById("customInput").addEventListener("input", updateHintText);

document.getElementById("hintButton").addEventListener("click", () => {
  const box = document.getElementById("hintBox");
  const show = box.style.display === "none";
  box.style.display = show ? "block" : "none";
  document.getElementById("hintButton").textContent =
    show ? "🙈 ヒントを隠す" : "💡 ヒントを見る";
});

document.getElementById("addSentenceButton").addEventListener("click", () => {
  const sentence = currentSentence();

  if (!sentence || sentence.includes("[")) {
    showToast("単語カードを選ぶか、英語を入力してください。");
    return;
  }

  if (speechLines.length === 0) {
    speechLines.push(TOPICS[currentTopicKey].intro);
  }

  speechLines.push(sentence);
  progress.sentencesAdded += 1;
  saveProgress();
  renderSpeech();
  showToast("スピーチに文を追加しました。");
});

function renderSpeech() {
  const text = speechLines.length
    ? [...speechLines, "Thank you for listening."].join("\n")
    : "トピックと内容を選ぶと、ここにスピーチが表示されます。";

  document.getElementById("speechText").textContent = text;
}

document.getElementById("clearSpeechButton").addEventListener("click", () => {
  speechLines = [];
  renderSpeech();
  showToast("スピーチを消しました。");
});

function speakEnglish(text) {
  if (!("speechSynthesis" in window)) {
    showToast("このブラウザーは音声読み上げに対応していません。");
    return;
  }

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-GB";
  utterance.rate = Number(document.getElementById("speechRate").value);
  window.speechSynthesis.speak(utterance);
}

document.getElementById("readSpeechButton").addEventListener("click", () => {
  if (!speechLines.length) {
    showToast("先にスピーチへ文を追加してください。");
    return;
  }
  speakEnglish(document.getElementById("speechText").textContent);
});

document.getElementById("speechRate").addEventListener("input", event => {
  document.getElementById("speechRateValue").textContent =
    `${Number(event.target.value).toFixed(1)}×`;
});

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }
    showToast("コピーしました。");
  } catch {
    showToast("コピーできませんでした。");
  }
}

document.getElementById("copySpeechButton").addEventListener("click", () => {
  copyText(document.getElementById("speechText").textContent);
});

function makeVocabCard([icon, english, kana, japanese]) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "card-btn";

  const iconDiv = document.createElement("div");
  iconDiv.className = "card-icon";
  iconDiv.textContent = icon;

  const englishDiv = document.createElement("div");
  englishDiv.className = "card-en";
  englishDiv.textContent = english;

  const kanaDiv = document.createElement("div");
  kanaDiv.className = "card-kana";
  kanaDiv.textContent = kana || "";

  const japaneseDiv = document.createElement("div");
  japaneseDiv.className = "card-jp";
  japaneseDiv.textContent = japanese || "";

  button.append(iconDiv, englishDiv, kanaDiv, japaneseDiv);
  button.addEventListener("click", () => speakEnglish(english));
  return button;
}

function renderVocab() {
  const category = document.getElementById("vocabCategory").value;
  const deck = document.getElementById("vocabDeck");
  deck.innerHTML = "";

  const topicCards = Object.values(TOPICS)
    .flatMap(topic => topic.reasons)
    .flatMap(reason => reason.cards);

  const countryCards = COUNTRIES.map(country => [
    countryFlag(country.code),
    countrySpeechName(country),
    country.kana,
    country.japanese
  ]);

  const allCards = [...EXTRA_VOCAB, ...topicCards];

  const visibleCards = category === "countries"
    ? countryCards
    : category === "other"
      ? allCards
      : [...allCards, ...countryCards];

  visibleCards.forEach(card => deck.appendChild(makeVocabCard(card)));
}

document.getElementById("vocabCategory").addEventListener("change", renderVocab);

document.getElementById("resetProgressButton").addEventListener("click", () => {
  if (!window.confirm("学習記録をリセットしますか？")) return;

  progress = { sentencesAdded: 0 };
  try {
    localStorage.removeItem("englishLearningProgress");
  } catch {}

  updateProgressDisplay();
  showToast("学習記録をリセットしました。");
});

buildTopicButtons();
updateProgressDisplay();
renderSpeech();
</script>
